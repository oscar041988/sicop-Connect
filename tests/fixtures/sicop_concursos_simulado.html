<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SICOP</title>
<!-- SIMULADO: imita la consulta pública de concursos observada el 2026-10-27 (docs/DETALLE_CARTEL.md): encabezado
     «Búsqueda avanzada» con rol button, la etiqueta «Número de SICOP» NO unida a su casilla, «Consultar», la fila del
     resultado con su enlace «[tipo] descripción» y la ficha que pide sus datos con fetch a las mismas rutas de
     prod-api.sicop.go.cr. No es la página real. Las pruebas reemplazan __VARIANTE__ y responden los fetch con
     tests/fixtures/ficha_simulada/. Variantes: normal · captcha · bloqueo · captcha_en_ficha · sin_avanzada ·
     captcha_en_descarga · orden_distinto. -->

<style>
  #avanzada { display: none; }
  table { border-collapse: collapse; }
  td { border: 1px solid #999; padding: 4px; }
</style>
</head>
<body>
<h5>Consulta de procedimientos de compra publicados</h5>
<div role="button" tabindex="0" id="cab-simple">Búsqueda simple</div>
<div role="button" tabindex="0" id="cab-avanzada">Búsqueda avanzada</div>
<div id="avanzada">
  <label>Desde</label> <input id="regDtFrom" value="27/04/2026">
  <label>Hasta</label> <input id="pubHasta" value="27/10/2026">
  <!-- Etiquetas flotantes, como en SICOP (prueba real del 2026-10-27): la etiqueta va DESPUÉS de su casilla, en
       el mismo contenedor. La casilla que sigue a «Número de SICOP» es la de «Código de clasificación». -->
  <span class="p-floatlabel"><input id="instCartelNo"><label>Número de procedimiento</label></span>
  <span class="p-floatlabel"><input id="attr_cartelNo"><label>Número de SICOP</label></span>
  <span class="p-floatlabel"><input id="attr_identi"><label>Código de clasificación</label></span>
  <label>Estado de concurso</label>
  <select><option>En recepción de ofertas</option></select>
  <button type="button" id="consultar">Consultar</button>
</div>
<table><tbody id="resultados"></tbody></table>
<div id="ficha"></div>
<div id="documentos"></div>
<script>
  const VARIANTE = "__VARIANTE__";
  const API = "https://prod-api.sicop.go.cr";
  const pedir = (ruta, metodo, cuerpo) => fetch(API + ruta,
    {method: metodo, body: metodo === "POST" ? (cuerpo || "{}") : undefined}).then(r => r.text());
  const captcha = () => document.body.insertAdjacentHTML("beforeend",
    '<iframe src="https://www.google.com/recaptcha/api2/anchor" title="reCAPTCHA"></iframe><p>No soy un robot</p>');

  if (VARIANTE === "captcha") captcha();
  if (VARIANTE === "bloqueo") {
    document.body.innerHTML = "<p>No fue posible acceder a la página solicitada. Por favor, póngase en contacto " +
      "con nosotros.</p><p>ID de soporte: 0123456789abcdef</p>";
  }
  if (VARIANTE === "sin_avanzada") document.getElementById("cab-avanzada").remove();

  const cab = document.getElementById("cab-avanzada");
  if (cab) cab.addEventListener("click", () => { document.getElementById("avanzada").style.display = "block"; });

  const consultar = document.getElementById("consultar");
  if (consultar) consultar.addEventListener("click", async () => {
    const valor = (id) => document.getElementById(id).value;
    const datos = JSON.parse(await pedir("/bid/api/v1/public/epCartel/searchEpCartelsSp", "POST",
      JSON.stringify({instCartelNo: valor("instCartelNo"), cartelNo: valor("attr_cartelNo"),
                      identi: valor("attr_identi")})));
    const filas = document.getElementById("resultados");
    filas.innerHTML = "";
    for (const c of datos.content || []) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${c.instCartelNo}<br>${c.cartelInstNm}</td>` +
        `<td><a href="#" class="cartel">[${c.proceType}] ${c.cartelNm}</a><br>Encargado de publicación: ` +
        `<a href="#">PERSONA SIMULADA</a></td><td>${c.cartelStatStr}</td>`;
      filas.appendChild(tr);
    }
  });

  document.addEventListener("click", async (e) => {
    if (!e.target.classList || !e.target.classList.contains("cartel")) return;
    e.preventDefault();
    history.pushState({}, "", "/app/module/bid/public/cartel-specification-published");
    document.getElementById("ficha").innerHTML = "<h5>Ingreso del pliego de condiciones</h5>" +
      "<label>Estado del concurso</label> <input readonly>";
    if (VARIANTE === "captcha_en_ficha") { captcha(); return; }
    await pedir("/bid/api/v1/public/epCartel/findPublishedById", "POST");
    await pedir("/bid/api/v1/public/epCartelRoleStaff/findByEpCartelId", "POST");
    await pedir("/bid/api/v1/public/epCartelProd/findByEpCartelId", "POST");
    await pedir("/bid/api/v1/public/epCartelSustCriteria/findAllByCartelId", "GET");
    await pedir("/bid/api/v1/public/epCartelSustCriteriaImpact/findAllByCartelId", "GET");
    const documentos = JSON.parse(await pedir("/bid/api/v1/public/epCartelFile/getCartelFilesById", "GET"));
    mostrarDocumentos(documentos, 0);
  });

  // Documentos (lección 3, observado el 2026-10-27): tabla de 10 por página. El nombre del archivo es una celda que
  // NO hace nada al hacer clic (primera prueba real); se descarga con el botón de la última columna → downloadWithPAR
  // → el archivo desde el almacén, con una clave temporal en la ruta; la página lo pide dos veces, como la real.
  const ALMACEN = "https://objectstorage.us-ashburn-1.oraclecloud.com/p/CLAVE-SIMULADA-NO-ANOTAR/n/sim/b/sim/o";
  function mostrarDocumentos(lista, pagina) {
    // orden_distinto: la tabla no sigue el orden de la lista (obliga a volver a la primera página).
    const documentos = VARIANTE === "orden_distinto" ? [...lista].reverse() : lista;
    // «No.» es el número de FILA (1, 2, 3…), no docFileSeqno: Santa Ana tiene los documentos 1, 2, 4… (prueba real).
    const filas = documentos.slice(pagina * 10, pagina * 10 + 10).map((d, i) =>
      `<tr><td>${pagina * 10 + i + 1}</td><td>No</td><td>${d.fileTypeNm}</td><td>${d.docNm}</td>` +
      `<td class="text-center">${d.clientFileNm}</td>` +
      `<td><button type="button" class="p-button descargar" data-server="${d.serverFileNm}" ` +
      `data-ruta="${d.fileServerPath}"><i class="pi pi-download"></i></button></td></tr>`).join("");
    const hay = (pagina + 1) * 10 < documentos.length;
    const antes = pagina > 0;
    document.getElementById("documentos").innerHTML =
      `<div class="p-datatable"><table><tr><th>No.</th><th>Confidencial</th><th>Tipo de documento</th>` +
      `<th>Nombre del documento</th><th>Documento</th><th></th></tr>${filas}</table>` +
      `<button type="button" class="p-paginator-prev" aria-label="Página anterior" ${antes ? "" : "disabled"}>` +
      `&lt;</button>` +
      `<button type="button" class="p-paginator-next" aria-label="Página siguiente" ${hay ? "" : "disabled"}>` +
      `&gt;</button></div>`;
    document.querySelector(".p-paginator-prev").addEventListener("click", () => mostrarDocumentos(lista, pagina - 1));
    document.querySelector(".p-paginator-next").addEventListener("click", () => mostrarDocumentos(lista, pagina + 1));
    document.querySelectorAll("button.descargar").forEach(b => b.addEventListener("click", async () => {
      if (VARIANTE === "captcha_en_descarga") { captcha(); return; }
      await pedir("/comn/api/v1/public/comnFile/downloadWithPAR", "GET");
      for (let i = 0; i < 2; i++) await fetch(`${ALMACEN}${b.dataset.ruta}/${b.dataset.server}`);
    }));
  }
</script>
</body>
</html>
