{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section>
  <h1>Iniciar sesión</h1>
  <p class="sub">El panel tiene decisiones comerciales de Hermatix: solo entran personas autorizadas.</p>
  <form class="revision acceso" method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="siguiente" value="{{ siguiente }}">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label>Correo
      <input type="email" name="email" maxlength="254" required autocomplete="username" value="{{ email or '' }}">
    </label>
    <label>Contraseña
      <span class="campo-contrasena">
        <input type="password" name="contrasena" id="contrasena" maxlength="128" required autocomplete="current-password">
        <button type="button" class="btn-mostrar" onclick="toggleContrasena()" aria-label="Mostrar contraseña">
          <svg class="ojo-abierto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="ojo-cerrado" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </span>
    </label>
    <script>
      function toggleContrasena() {
        var campo = document.getElementById('contrasena');
        var abierto = document.querySelector('.ojo-abierto');
        var cerrado = document.querySelector('.ojo-cerrado');
        if (campo.type === 'password') {
          campo.type = 'text';
          abierto.style.display = 'none';
          cerrado.style.display = 'block';
        } else {
          campo.type = 'password';
          abierto.style.display = 'block';
          cerrado.style.display = 'none';
        }
      }
    </script>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
