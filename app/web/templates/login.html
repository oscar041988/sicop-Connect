{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section>
  <h1>Iniciar sesión</h1>
  <p class="sub">El panel tiene decisiones comerciales de Hermatix: solo entran personas autorizadas.</p>
  <form class="revision acceso" method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="siguiente" value="{{ siguiente }}">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label>Correo
      <input type="email" name="email" maxlength="254" required autocomplete="username" value="{{ email or '' }}">
    </label>
    <label>Contraseña
      <input type="password" name="contrasena" maxlength="128" required autocomplete="current-password">
    </label>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
