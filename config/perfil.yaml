# Perfil de Hermatix (asistente de elegibilidad, lección 1): elementos sugeridos en /perfil.
# Salen del borrador docs/PERFIL_LISTA_INICIAL.md (2026-11-02), todavía SIN aprobar por Oscar. Cuando él decida,
# se edita esta lista: no hace falta tocar código. Un elemento sugerido no existe hasta que un administrador lo
# agrega desde /perfil.
# Tipos: experiencia, certificacion, permiso, personal, poliza, financiero, legal.

sugerencias:
  experiencia:
    - Años de experiencia en GPS y gestión de flotas
    - Constancias o cartas de clientes de servicios GPS (últimos 5 años)
    - Clientes activos con número de vehículos y última factura
  personal:
    - Técnicos de instalación y mantenimiento (lista y currículos)
    - Profesionales en planilla (ingeniería en sistemas, autotrónica)
  certificacion:
    - Carta del fabricante o certificado de marca de los equipos
    - Certificados de calidad o normas de los equipos
  permiso:
    - Patente municipal vigente y constancia de estar al día
    - Permiso sanitario de funcionamiento
  poliza:
    - Póliza de riesgos del trabajo (INS)
    - Póliza de responsabilidad civil
    - Seguro de los equipos
  legal:
    - Al día con la CCSS
    - Al día con FODESAF
    - Al día con Hacienda (actividad económica afín)
    - Actividad comercial registrada
    - Declaración jurada de prohibiciones (art. 28 y 29 LGCP)
    - Declaración de beneficiarios finales y propiedad de las acciones
    - Firma digital del representante legal
  financiero:
    - Estados financieros

# Asistente, lección 2: frases que, si aparecen en un requisito del cartel, proponen ese elemento del perfil
# (sin tildes ni mayúsculas importan). El usuario confirma o cambia la propuesta en la lista de verificación.
claves:
  Años de experiencia en GPS y gestión de flotas:
    - anos de experiencia
    - experiencia minima
    - experiencia en labores
    - experiencia en actividades
  Constancias o cartas de clientes de servicios GPS (últimos 5 años):
    - cartas de recomendacion
    - constancias de procedimientos
    - certificaciones firmadas
    - ventas adjudicadas
  Clientes activos con número de vehículos y última factura:
    - clientes activos
  Técnicos de instalación y mantenimiento (lista y currículos):
    - curriculo
    - tecnicos de instalacion
    - personal tecnico
  Profesionales en planilla (ingeniería en sistemas, autotrónica):
    - en planilla
    - ingeniero en sistemas
  Carta del fabricante o certificado de marca de los equipos:
    - carta de fabrica
    - certificado de marca
    - integrador autorizado
  Patente municipal vigente y constancia de estar al día:
    - patente
  Permiso sanitario de funcionamiento:
    - permiso sanitario
  Póliza de riesgos del trabajo (INS):
    - riesgos del trabajo
    - riesgos de trabajo
  Póliza de responsabilidad civil:
    - responsabilidad civil
  Seguro de los equipos:
    - seguro para los equipos
  Al día con la CCSS:
    - ccss
  Al día con FODESAF:
    - fodesaf
  Al día con Hacienda (actividad económica afín):
    - obligaciones tributarias
    - hacienda
    - impuestos nacionales
  Actividad comercial registrada:
    - actividad comercial
    - actividad economica
  Declaración jurada de prohibiciones (art. 28 y 29 LGCP):
    - prohibiciones
  Declaración de beneficiarios finales y propiedad de las acciones:
    - beneficiario final
    - beneficiarios finales
  Firma digital del representante legal:
    - firma digital
    - firmada digitalmente
