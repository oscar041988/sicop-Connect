# Perfil de Hermatix (asistente de elegibilidad, lección 1): elementos sugeridos en /perfil.
# Salen de docs/PERFIL_LISTA_INICIAL.md. Oscar aprobó el 2026-11-04 cargar ya la PARTE A (datos, no documentos);
# los dan los encargados y administradores del sistema. La parte B (documentos) se carga solo en el servidor,
# cuando esté actualizado. Para cambiar la lista se edita este archivo: no hace falta tocar código. Un elemento
# sugerido no existe hasta que un administrador lo agrega desde /perfil.
# Tipos: experiencia, certificacion, permiso, personal, poliza, financiero, legal, capacidad, evaluacion (0035).

sugerencias:
  experiencia:
    # Parte A (datos)
    - Años de experiencia en GPS y gestión de flotas
    - Años de experiencia en CCTV y redes
    - Proyectos terminados por tipo (GPS, CCTV, centros de monitoreo)
    # Parte B (documentos)
    - Constancias o cartas de clientes de servicios GPS (últimos 5 años)
    - Clientes activos con número de vehículos y última factura
  personal:
    - Técnicos en planilla y años en el área
    - Técnicos con carné de trabajo en alturas
    - Técnicos de instalación y mantenimiento (lista y currículos)
    - Profesionales en planilla (ingeniería en sistemas, autotrónica)
  capacidad:
    - Soporte técnico (horario y tiempo de atención)
    - Taller o centro de servicio (dirección, correo y teléfonos)
    - Garantía técnica que ofrece Hermatix (meses)
    - Marcas que vende Hermatix y distribución autorizada
  evaluacion:
    - Condición PYME (certificación del MEIC)
    - ISO 14001, Bandera Azul u otro programa ambiental
    - Política de inclusión laboral de mayores de 45 años
  certificacion:
    - Carta del fabricante o certificado de marca de los equipos
    - Certificados de calidad o normas de los equipos
  permiso:
    - Patente municipal vigente y constancia de estar al día
    - Permiso sanitario de funcionamiento
  poliza:
    - Póliza de riesgos del trabajo (INS)
    - Póliza de responsabilidad civil
    - Seguro de los equipos
  legal:
    - Años inscrita en Hacienda en la actividad
    - Inscrita en SICOP y en el Registro de Proveedores (datos al día)
    - Citas de inscripción de la sociedad y plazo de la sociedad
    - Actividad comercial registrada
    - Firma digital del representante legal
    - Al día con la CCSS
    - Al día con FODESAF
    - Al día con Hacienda (actividad económica afín)
    - Declaración jurada de prohibiciones (art. 28 y 29 LGCP)
    - Declaración de beneficiarios finales y propiedad de las acciones
    - Personería jurídica
  financiero:
    - Estados financieros

